ets you dial the cooling spray across 5 levels\n✔ Comfort: everyone feels it differently, so the real trick is tuning the cooling to you\n\nBottom line: your skin comes first, the device second.\n📌 Save this before your Seoul trip and drop your questions in the comments\n\n📍 Beauty Blossom Clinic · Hapjeong Stn. Exit 3, Seoul (6F reception)\n☎ +82-2-336-7511 · Mon-Fri 10:00-20:00 / Sat-Sun 10:00-16:30\n\n#Density #ThermageFLX #SkinLifting #KBeauty #BeautyBlossomClinic"},{"cover":"c/en_2.png","vids":["v/en/2_1.mp4","v/en/2_2.mp4","v/en/2_3.mp4","v/en/2_4.mp4","v/en/2_5.mp4"],"cap":"Density's 3 tips, Classic vs High vs Alpha, in one swipe\nSame Density, different feel depending on the tip.\n\n✔ CLASSIC (1st gen): monopolar, steady heat in the deep layer\n✔ HIGH (2nd gen): mono + bipolar, balanced from shallow to deep\n✔ ALPHA (3rd gen, newest): a bigger electrode, so wider and deeper\n\n💡 Which one fits you depends on skin thickness, your concern area and how fast you want to see change\n📌 Save this and ask \"which tip is right for me?\" at your consult\n\n📍 Beauty Blossom Clinic · Hapjeong Stn. Exit 3, Seoul (6F reception)\n☎ +82-2-336-7511 · Mon-Fri 10:00-20:00 / Sat-Sun 10:00-16:30\n\n#Density #DensityAlphaTip #SkinLifting #SeoulSkinClinic #BeautyBlossomClinic"},{"cover":"c/en_3.png","vids":["v/en/3_1.mp4","v/en/3_2.mp4","v/en/3_3.mp4","v/en/3_4.mp4","v/en/3_5.mp4"],"cap":"Is Density a good match for your skin? Check these 3 signs\nIf one of these sounds like you, it's worth asking about.\n\n✔ Skin feels looser than it used to: RF heat helps build collagen and elastin, filling in slowly over 1-3 months\n✔ Fine lines bug you: bipolar RF covers the shallow layer closely\n✔ No time for downtime: around 40 min for 600 shots, and you can wash and do makeup right after\n\n💡 Want to reshape your contour too? A layered plan with Ulthera or Sofwave is built around your concerns\n📌 Send this to the friend who keeps saying \"my skin feels loose lately\"\n\n📍 Beauty Blossom Clinic · Hapjeong Stn. Exit 3, Seoul (6F reception)\n☎ +82-2-336-7511 · Mon-Fri 10:00-20:00 / Sat-Sun 10:00-16:30\n\n#Density #RFLifting #KoreanSkincare #KBeauty #BeautyBlossomClinic"}]},{"code":"ja","label":"일본","acct":"beautyblossom_jp","sets":[{"cover":"c/ja_1.png","vids":["v/ja/1_1.mp4","v/ja/1_2.mp4","v/ja/1_3.mp4","v/ja/1_4.mp4","v/ja/1_5.mp4"],"cap":"デンシティとサーマクール、何が違うの？高周波の数・クーリング・痛みを3つでまとめました。\n\nサーマクールFLXはモノポーラ、デンシティはモノポーラ＋バイポーラ。深い層と浅い層を1ショットで続けて温めます。\nクーリングはガス噴射で5段階。痛みの感じ方は人それぞれなので、施術中も声をかけながら調整します。\n機械より先に、自分の肌の厚みと悩みで選ぶのがポイント。\n\n※施術の効果や経過には個人差があります。カウンセリングの上で進めます。\n保存して、迷った時に見返してね。\n\n📍 BEAUTY BLOSSOM CLINIC（ソウル・合井駅3番出口すぐ）\n\n#デンシティ #サーマクール #韓国美容皮膚科 #渡韓美容 #高周波リフト\n\n[代替テキスト] デンシティとサーマクールの違い（高周波の数、クーリング5段階、痛みの調整）をまとめた5枚のカード動画。\n\n[音楽] Mixkit \"I Do\" (free license)\n[アップロード] 03 → 02 → 01 の順に、各セット 01〜05 をカルーセル投稿"},{"cover":"c/ja_2.png","vids":["v/ja/2_1.mp4","v/ja/2_2.mp4","v/ja/2_3.mp4","v/ja/2_4.mp4","v/ja/2_5.mp4"],"cap":"デンシティのチップは3種類。クラシック・ハイ・アルファ、私に合うのはどれ？\n\nクラシック：定番のモノポーラで深い層へ均一に。\nハイ：モノポーラ＋バイポーラで浅い層から深い層までバランスよく。\nアルファ：電極面積を広げた最新型で、もっと広く深く。\nどれが合うかは肌の厚み・悩みの部位・希望のペースで変わるので、カウンセリングで一緒に選びます。\n\n※施術の効果や経過には個人差があります。\n気になるチップをコメントで教えてね。\n\n📍 BEAUTY BLOSSOM CLINIC（ソウル・合井駅3番出口すぐ）\n\n#デンシティ #デンシティチップ #韓国美容皮膚科 #渡韓美容 #リフトアップ\n\n[代替テキスト] デンシティのクラシック・ハイ・アルファ3種類のチップの違いを説明する5枚のカード動画。\n\n[音楽] Mixkit \"I Do\" (free license)\n[アップロード] 03 → 02 → 01 の順に、各セット 01〜05 をカルーセル投稿"},{"cover":"c/ja_3.png","vids":["v/ja/3_1.mp4","v/ja/3_2.mp4","v/ja/3_3.mp4","v/ja/3_4.mp4","v/ja/3_5.mp4"],"cap":"デンシティがぴったりな肌、セルフチェックしてみて。\n\nハリがゆるんだ気がする → 高周波の熱でコラーゲン・エラスチンをサポート、1〜3か月でじわじわ。\n小じわが気になる → バイポーラが浅い層を細かくカバー。\nダウンタイムが気になる → 600ショットで40分前後、施術後すぐ洗顔・メイクOK（当日はサウナ・飲酒だけ控えて）。\n輪郭まで変えたいなら、ウルセラやソフウェーブとのレイヤードで設計します。\n\n※施術の効果や経過には個人差があります。\n当てはまる項目、いくつあった？\n\n📍 BEAUTY BLOSSOM CLINIC（ソウル・合井駅3番出口すぐ）\n\n#デンシティ #肌のハリ #韓国美容皮膚科 #渡韓美容 #ダウンタイム少なめ\n\n[代替テキスト] デンシティが合う肌タイプ（ハリ、小じわ、ダウンタイム、レイヤード施術）をまとめた5枚のカード動画。\n\n[音楽] Mixkit \"I Do\" (free license)\n[アップロード] 03 → 02 → 01 の順に、各セット 01〜05 をカルーセル投稿"}]},{"code":
